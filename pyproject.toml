[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secureagentrag-benchmark"
version = "0.2.0"
description = "A multilingual benchmark for security, privacy and responsible behaviour in agentic RAG systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Joseph Arayemi", email = "yemi@giitafrica.com"}]
keywords = [
  "agentic-rag",
  "prompt-injection",
  "responsible-ai",
  "multilingual-ai-safety",
  "cloud-security",
  "benchmark"
]

[project.scripts]
secureagentrag = "secureagentrag.cli:main"

[project.optional-dependencies]
aws = ["boto3>=1.35"]
azure = ["azure-identity>=1.17", "azure-search-documents>=11.6", "openai>=1.50"]
open-weight = ["openai>=1.50"]
cloud = [
  "boto3>=1.35",
  "azure-identity>=1.17",
  "azure-search-documents>=11.6",
  "openai>=1.50"
]

[tool.setuptools.packages.find]
where = ["src"]
