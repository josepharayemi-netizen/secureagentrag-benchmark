name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip .
      - name: Regenerate source dataset
        run: python scripts/generate_dataset.py
      - name: Regenerate translation workbooks
        run: |
          python scripts/export_translation_workbooks.py
          git diff --exit-code -- translation_workbooks
      - name: Validate source dataset
        run: secureagentrag validate
      - name: Run safe mock pilot
        run: secureagentrag pilot
      - name: Verify empirical pilot remains evidence-gated
        run: |
          set +e
          secureagentrag preflight
          status=$?
          test "$status" -eq 2
      - name: Verify untranslated workbooks remain unreleased
        run: |
          set +e
          secureagentrag review-status > /tmp/review-status.json
          status=$?
          test "$status" -eq 2
      - name: Build a reviewer handoff packet
        run: secureagentrag review-packet fr --output /tmp/review-packets
      - name: Run tests
        run: python -m unittest discover -s tests -v
